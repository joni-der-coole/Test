name: Build PS4 PKG

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: OpenOrbis SDK installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y wget make clang python3
          git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /opt/openorbis
          echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV
          echo "/opt/openorbis/bin" >> $GITHUB_PATH

      - name: ELF kompilieren
        run: |
          make

      - name: PKG erstellen
        run: |
          # Hier wird die ELF-Datei mit einer minimalen param.sfo zu einem PKG verpackt
          # Das OpenOrbis SDK stellt hierfür Skripte im Toolchain-Ordner bereit
          python3 /opt/openorbis/tools/pkg_builder.py bin/payload_launcher.elf --title "Payload Launcher" --titleid "CUSA99999" --out bin/payload_launcher.pkg

      - name: PKG-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ps4-payload-launcher-pkg
          path: bin/payload_launcher.pkg
