name: Build PS4 PKG with Linux Icon Updated

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: OpenOrbis SDK installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y wget make clang python3 imagemagick
          git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /opt/openorbis
          echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV
          echo "/opt/openorbis/bin" >> $GITHUB_PATH

      - name: Offizielles Linux-Logo herunterladen und anpassen
        run: |
          mkdir -p assets
          wget -O assets/tux.png "https://upload.wikimedia.org/wikipedia/commons/3/35/Tux.svg.png"
          convert assets/tux.png -resize 512x512 -background none -gravity center -extent 512x512 assets/icon0.png
          convert assets/tux.png -resize 1000x1000 -background "#111111" -gravity center -extent 1920x1080 assets/pic0.png

      - name: ELF kompilieren
        run: |
          make

      - name: PKG-Ordnerstruktur vorbereiten und verpacken
        run: |
          # Erstelle einen temporären Build-Ordner für das Paket
          mkdir -p pkg_root/sce_sys
          
          # Kopiere die Icons in den sce_sys Ordner (Standard für PS4 Homebrew)
          cp assets/icon0.png pkg_root/sce_sys/
          cp assets/pic0.png pkg_root/sce_sys/
          
          # Erstelle eine minimale param.sfo mit dem SDK-Tool (falls vorhanden) oder nutze den Builder
          # Wir übergeben die ELF und die Assets direkt an den Python-Builder
          python3 /opt/openorbis/tools/pkg_builder.py \
            --elf bin/payload_launcher.elf \
            --icon assets/icon0.png \
            --bg assets/pic0.png \
            --title "Linux Payload Launcher" \
            --titleid "CUSA99999" \
            --out bin/payload_launcher.pkg || \
          python3 /opt/openorbis/tools/pkg_builder.py bin/payload_launcher.elf --title "Linux Payload Launcher" --titleid "CUSA99999" --out bin/payload_launcher.pkg

      - name: PKG-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ps4-linux-launcher-pkg
          path: bin/payload_launcher.pkg
